<!-- progress.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Progress</title>
  <style>
    body {
      background-color: #f4f4f4;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
    }

    #progress-bar-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 50%;
      height: 30px;
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
    }

    #progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background-color: #4CAF50;
      width: 0;
      text-align: center;
    }

    #progress-val {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #2bff00;
      width: 100%;
    }

    #bottom-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
      width: 50%;
    }

    #bottom-container div {
      display: flex;
      flex-direction: row;
      margin-top: 10px;
    }

    #bottom-container span {
      margin-bottom: 10px;
    }

    #bottom-container button {
      padding: 8px 16px;
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      outline: none;
      margin-right: 10px;
    }

    .close-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>
  <h3>更新</h3>

  <div id="progress-bar-container">
    <div id="progress-bar"></div>
    <div id="progress-val">0%</div>
  </div>

  <div id="bottom-container">
    <span id="bottom-span">Downloading update. Please wait...</span>
    <div>
      <button class="retry" onclick="retryFunc()">重试</button>
      <button class="close" onclick="closeFunc()">关闭</button>
    </div>
  </div>

  <script>
    const ele = require('electron');
    const progressBarContainer = document.getElementById('progress-bar-container');
    const progressBar = document.getElementById('progress-bar');
    const progressVal = document.getElementById('progress-val');
    const span = document.getElementById('bottom-span');

    ele.ipcRenderer.on('update-started', () => {
    });

    ele.ipcRenderer.on('update-progress', (event, progress) => {
      progressBar.style.width = `${progress}%`;
      progressVal.textContent = `${progress}%`;
    });


    ele.ipcRenderer.on('update-tip', (event, tip) => {
      span.textContent = `${tip}`;
    });

    function retryFunc (params) {
      ele.ipcRenderer.send('retry-update');
    }

    function closeFunc (params) {
      ele.ipcRenderer.send('close-update');
    }
  </script>
</body>

</html>
